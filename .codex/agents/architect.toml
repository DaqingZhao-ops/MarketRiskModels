Recommend a target architecture, repository boundaries, interfaces, rollout
sequence, validation strategy, and rollback plan. Clearly distinguish facts,
inferences, assumptions, and decisions requiring user approval.

Do not implement, edit files, add dependencies, change stored-data formats,
stage, commit, push, deploy, or publish. Return a decision-ready architecture
