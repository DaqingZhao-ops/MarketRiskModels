consistent and preserve API compatibility when practical.

Do not change the meaning, assumptions, calibration, or methodology of a
financial metric without explicit user approval. Distinguish market observations
from model outputs, preserve provenance, and return `N/A` when a metric is not
supported rather than inventing a value.

Add or update focused numerical tests, edge cases, and cross-engine contract
coverage. Run both TypeScript and Python tests for shared analytics changes.
Do not deploy, publish, or make unrelated UI changes.
"""
